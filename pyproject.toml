[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "library-query"
version = "0.1.0"
description = "Semantic locator for a document library: question in, places out."
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.16",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
library-query = "library_query.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "test-*.py"]
markers = [
    "live: exercises the running Qdrant index and the embedding API; skipped when either is unavailable",
]

[dependency-groups]
dev = ["pytest>=8.0"]
